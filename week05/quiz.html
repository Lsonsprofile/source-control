<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>Document</title>
</head>
<body>
    <main class="box">
        <h1>Basic HTML and CSS quiz</h1>
        <form>
            <div class="quiz-item">
                <label for="q1"><span>1.</span>What does HTML stand for?</label>
                <input type="text" name="q1" id="q1" required>
            </div>
            <div class="quiz-item">
                <label for="q2"><span>2.</span> How are id or class attributes selected in CSS?</label>
                <textarea name="q2" id="q2"></textarea>
            </div>
            <div class="quiz-item">
                <label for="q3"><span>3.</span> Which of the following is a valid CSS comment </label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose one...</option>
                    <option value="a">A.  /*This is a comment*/</option>
                    <option value="b">B.  &lt;!--This is a comment--&gt;</option>
                    <option value="c">C.  //This is a comment</option>
                </select>
            </div>
            <div class="quiz-item">
                <label for="q4"><span>4.</span> What is the bottom margin given for this declearation?</label>
                <code>margin: 10px 5px 15px;</code>
                <input type="number" name="q4" id="q4">
            </div>
            <button type="submit">Submit Quiz for Grading</button>
        </form>
    </main>
    
</body>
</html>
