<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/poll-form.css">
  <title>HTML Forms</title>
</head>
<body>

  <header>
    <h1>WDD130 | HTML form user poll</h1>
  </header>

  <main>
    <form action="#" method="post">
      <fieldset>
        <legend>Contact Information</legend>
        <div class="form-item column2">
          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname">
        </div>
        
        <div class="form-item column2">
          <label for="useremail">Email:</label>
          <input type="email" id="useremail" name="useremail">
        </div>
      </fieldset>
      
      <fieldset>
        <legend>Questions</legend>
        <div class="form-item column1">
          <label for="browsers">What browsers do you use?</label>
          <select id="browsers" name="browsers">
            <option value="chrome">Chrome</option>
            <option value="firefox">Firefox</option>
            <option value="safari">Safari</option>
            <option value="edge">Edge</option>
            <option value="other">Others</option>
          </select>
        </div>

        <div class="form-item column1">
          <label for="pet">Do you have a household pet?</label>
          <input type="checkbox" id="pet" name="pet">
        </div>

        <div class="form-item column3">
          <label for="feedback">List the places you have lived.</label>
          <textarea id="feedback" name="feedback" placeholder="Nigeria, America, Canada, etc..." rows="3"></textarea>
        </div>
        
        <button type="submit">Submit Poll</button>
      </fieldset>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 My Website | HTML form user poll activity | Emmanuel Ndogo</p>
  </footer>

</body>
</html>
