<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nazbro Tech Hero Section</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:700,400,600" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      background:#14021f;
      color: #fff;
      justify-content: center;
      align-items: center;
    }
    .nasbroimage {
      position:absolute;
      left: 25px;
      top:15px;
      width: 70px;
      height: 70px;
      transform: rotate(40deg);
      animation: zoom-in-out 3s infinite;
    }
     @keyframes zoom-in-out {
      0%, 100% { transform: rotate(30deg) scale(1); }
      50% { transform: rotate(30deg) scale(1.5); }
    }

    .hero-section {
      position: relative;
      background: linear-gradient(135deg, #2D155B 0%,  100%);
      color: #fff;
      width: 100%;
      max-width: 12000px;
      min-height: 600px;
      border-radius: 10px;
      overflow: hidden;
      padding-bottom: 40px;
      margin: 0px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }

    .hero-wave {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1;
      pointer-events: none;
      height: 100%;
    }

    /* Hide text since it's in logo image now */
    .hero-logo span { 
      display: none; 
    }

    .hero-content {
      position: relative;
      z-index: 8;
      padding: 90px 0 0 60px;
      max-width: 560px;
    }
    
   .hero-title {
  font-size: 2.8rem;
  width: 100%;
  font-weight: 800;
  line-height: 1.09;
  margin-bottom: 18px;
  letter-spacing: 1px;
  text-transform: uppercase;
  background: linear-gradient(to right, #ffffff, #e2c6ff);
  -webkit-background-clip: text;
  background-clip: text;
  text-shadow: 0 2px 10px rgba(130, 60, 255, 0.3);
  display: flex;
  flex-direction: column;
}

.hero-sub {
  color: #FF44C1;
  font-size: 1.3rem;
  font-weight: 600;
  margin-bottom: 28px;
  letter-spacing: 0.8px;
  line-height: 1.4;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
  display: flex;
  flex-direction: column;
}

/* Typing effect */
.hero-sub span {
  display: inline-block;
  white-space: nowrap;
  overflow: hidden;
  animation: typing 3s steps(30, end) forwards;
}

/* ✅ use max-content so the whole text animates fully */
@keyframes typing {
  from {
    width: 0;
  }
  to{
    width:100%;
  }
}

    
    .hero-description {
      color: #d6c8f0;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 480px;
      font-weight: 400;
    }
    
    .hero-btn {
      background: linear-gradient(90deg, #a36cff 0%, #fd4bfa 100%);
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 14px 35px;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(200, 45, 220, 0.4);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    
    .hero-btn:hover {
      background: linear-gradient(90deg, #fd4bfa 0%, #a36cff 100%);
      box-shadow: 0 8px 25px rgba(230, 45, 220, 0.5);
      transform: translateY(-3px);
    }
    
    .hero-btn:active {
      transform: translateY(1px);
    }
.shapes-wrapper {
   background-color: transparent;
}
    
/* Single image for all shapes */
.shapes-image {
  position: absolute;
  top:5%;
  right: 40px;
  transform: translateY(-50%);
  width: auto;
  height: 90%;
  max-height: 450px;
  z-index: 4;
  transition: all 0.5s ease; 
  filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.9));
  animation: rotateClockwise 2s linear forwards;
}

@keyframes rotateClockwise {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

    .social-icons {
      position: absolute;
      bottom: 20px;
      left: 60px;
      display: flex;
      gap: 15px;
      z-index: 10;
    }
    
    .social-icons a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      text-decoration: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }
    
    .social-icons a:hover {
      background: linear-gradient(90deg, #a36cff 0%, #fd4bfa 100%);
      transform: translateY(-3px);
    }
    
    /* Decorative elements */
    .decorative-circle {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(159, 64, 255, 0.15) 0%, transparent 70%);
      z-index: 2;
      bottom: -150px;
      left: -150px;
    }
    
    .decorative-circle-2 {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 68, 193, 0.1) 0%, transparent 70%);
      z-index: 2;
      top: -100px;
      right: 300px;
    }
    
    /* Responsive tweaks */
    @media (max-width: 1000px) {
      .hero-content { 
        padding: 100px 0 0 100px; 
        max-width: 50%;
      }
      
      .hero-title {
        font-size: 2.4rem;
      }
      
      .shapes-image {
        height: 80%;
      }
      
      .social-icons {
        left: 100px;
      }
    }
    
    @media (max-width: 1000px) {
      .hero-section {
        min-height: 450px;
      }
      
      .hero-content { 
        padding: 90px 30px 0; 
        max-width: 100%;
        text-align: center;
      }
      
      .hero-title {
        font-size: 2.2rem;
      }
      
      .hero-sub {
        font-size: 1.1rem;
      }
      
      .hero-description {
        margin: 0 auto 32px;
      }
      
      .shapes-image {
        position: relative;
        height: 250px;
        margin: 0 auto;
        display: block;
        transform: none;
        top: 0;
        padding: 0 20px;
        left:0;
      }
      
      .hero-logo {
        left: 50%;
        transform: translateX(-50%);
        top: 20px;
      }
      
      .hero-logo:hover {
        transform: translateX(-50%) scale(1.05);
      }
      
      .social-icons {
        position: relative;
        left: 0;
        bottom: 0;
        justify-content: center;
        margin: 30px 0 20px;
      }
      
      .decorative-circle,
      .decorative-circle-2 {
        display: none;
      }
    }
    
    @media (max-width: 480px) {
      .hero-title {
        font-size: 1.9rem;
      }
      
      .hero-sub {
        font-size: 1rem;
      }
      
      .hero-btn {
        padding: 12px 28px;
        font-size: 1rem;
      }
      
      .shapes-image {
        height: 200px;
        left:0;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="brotech.png" class="nasbroimage" alt="Brotech Logo">
  </header>

<div class="hero-section">
    <!-- Decorative elements -->
    <div class="decorative-circle"></div>
    <div class="decorative-circle-2"></div>

    <!-- SVG lines as background effect -->
    <svg class="hero-wave" viewBox="0 0 970 400" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M0 100 Q300 30 970 160" stroke="#fff" opacity="0.13" stroke-width="3" fill="none"/>
        <path d="M0 220 Q400 90 970 240" stroke="#fff" opacity="0.08" stroke-width="3" fill="none"/>
        <path d="M0 320 Q600 190 970 320" stroke="#fff" opacity="0.07" stroke-width="3" fill="none"/>
        <path d="M0 20 Q600 30 970 100" stroke="#fff" opacity="0.07" stroke-width="3" fill="none"/>
        <path d="M970 0 Q630 370 0 330" stroke="#fff" opacity="0.10" stroke-width="3" fill="none"/>
    </svg>

    
    <div class="hero-content">
        <div class="hero-title">
  <span>TRANSFORMING</span>
  <span>IDEAS INTO DIGITAL</span>
  <span>MASTERPIECES</span>
</div>

<div class="hero-sub">
  <span>CREATIVE DIGITAL</span>
  <span>TECHNOLOGIST</span>
</div>

        <p class="hero-description">
            We blend cutting-edge technology with creative design to build digital solutions that captivate your audience and drive results.
        </p>
        <a href="#" class="hero-btn">
            <span>CONNECT HERE</span>
            <i class="fas fa-arrow-right"></i>
        </a>
    </div>
    <div class="shapes-wrapper">
    <!-- Single image for all shapes -->
    <img class="shapes-image" src="https://image2url.com/images/1756247055450-a4c5a9e7-2397-4caa-ba21-dd9b44d930c7.png" alt="3D Shapes">
    </div>
    <div class="social-icons">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
    </div>
</div>

</body>
</html>
