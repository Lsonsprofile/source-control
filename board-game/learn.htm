<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid Board Example</title>
  <style>
    body{
      margin:0;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(10, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 0; /* Remove gap, use borders for lines */
      width: max-content;
      margin: 40px auto;
    }
    .cell {
      width: 50px;
      height: 50px;
      background: #f0f0f0;
      border-top: 1px solid #030303;
      border-left: 1px solid #030303;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-sizing: border-box;
    }
    /* Add right border to last column cells */
    .cell:nth-child(10n) {
      border-right: 1px solid #030303;
    }
    /* Add bottom border to last row cells */
    .cell:nth-child(n+41) {
      border-bottom: 1px solid #030303;
    }
  </style>
</head>
