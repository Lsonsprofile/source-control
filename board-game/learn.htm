    <title>Circle Tokens on Board</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: auto;
            background-color: #f0f0f0;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .game-board {
            position: relative;
            width: 800px;
            height:800px;
            background-color: #2c3e50;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            padding: 20px;
            gap: 0;
            margin-top:5%;
        }

        .board-space {
            background-color: #fcfdff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border:1px solid black
        }

        .token {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .token:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }

        /* Token colors */
        .red { background: radial-gradient(circle at 30% 30%, #ff5e5e, #cc0000); }
        .blue { background: radial-gradient(circle at 30% 30%, #5e8cff, #0066cc); }
        .green { background: radial-gradient(circle at 30% 30%, #5eff7f, #00cc44); }
        .yellow { background: radial-gradient(circle at 30% 30%, #ffff5e, #cccc00); }
        .purple { background: radial-gradient(circle at 30% 30%, #c75eff, #8800cc); }

        /* 3D effect for tokens */
        .token::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
            filter: blur(1px);
        }

        .token::after {
            content: '';
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0,0,0,0.2);
            filter: blur(1px);
        }

        .board-title {
            position: absolute;
            top: -40px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }
        .instructions{
        position: relative;
        left:50px;
        top: 20px;
        margin-top: 20px;
        text-align: center;
        font-size: 18px;
        color: #2c3e50;
        }
    </style>
</head>
