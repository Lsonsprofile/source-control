<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="board.css">
    <title>Board game </title>
</head>
<body>
<div class="container">

    <div class="board-background">

        <div class="red-box"></div>

        <div class="yellow-box"></div>

        <div class="blue-box"></div>

        <div class="green-box"></div>

            <div class="cell" id="red-1"></div>
            <div class="cell" id="red-2"></div>
            <div class="cell" id="red-3"></div>
            <div class="cell" id="red-4"></div>
            <div class="cell" id="red-5"></div>
            <div class="cell" id="red-6"></div>

            <div class="cell-A" id="yellow-1"></div>
            <div class="cell-A" id="yellow-2"></div>
            <div class="cell-A" id="yellow-3"></div>
            <div class="cell-A" id="yellow-4"></div>
            <div class="cell-A" id="yellow-5"></div>
            <div class="cell-A" id="yellow-6"></div>
    </div>

    <div class="dice-container">
        <div class="dice-box" id="dice1" onclick="selectDice(1)"></div>
        <div class="dice-box" id="dice2" onclick="selectDice(2)"></div>
        <div class="dice-box" id="sum" onclick="selectDice(3)"></div>
    </div>
    
    <div class="instructions">
        <p>Click on a dice to select it.</p>
    </div>
    
    <div class="button-container">
        <button id="start-game" class="game-button" onclick="rollDice()">Roll dice</button>
    </div>
</div>
    <script src="board.js"></script>
</body>
</html>
