<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grid Box Border</title>
  <style>
    body{
      margin:0;
      padding:0;
      background-color:#6e5f5f;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(15, 40px);
      grid-template-rows: repeat(15, 40px);
      margin: 20px auto;
      width: max-content;
      border: 10px solid rgb(8, 88, 102);
      border-radius:10px;
      box-shadow: 5px 5px 50px rgba(0,0,0,0.3);
    }
    .cell {
      width: 40px;
      height: 40px;
      background: #f0f0f0;
      border: 1px solid #030303a6;
      box-sizing: border-box;
    }
    .cell-middle {
  position: relative;
}
.cell-middle:after {
  content: 'HOME';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: #85e7f869;
  color: rgb(0, 0, 0);
  z-index: 5;
  font-weight: 800;
  font-family: 'Orbitron', sans-serif;
  text-shadow: 0 0 8px rgba(0, 255, 255, 2.9);
  animation: pulse-glow 1s infinite alternate;
}
@keyframes pulse-glow {
  0% { box-shadow: 0 0 15px rgba(18, 247, 247, 1.9); }
  100% { box-shadow: 0 0 20px rgba(7, 211, 238, 0.8); }
}

.button-container {
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 5px;
    position: static; /* Remove absolute positioning */
    top:10px;
    left:10px;
    transform: none;
}
.game-button{
    width:80px;
    background-color: #b60b0b; /* Red background */
    color: white; /* White text */
    border:1px solid rgb(211, 23, 23); /* No border */
    padding: 10px 20px; /* Padding around the text */
    text-align: center; /* Centered text */
    text-decoration: none; /* No underline */
    display: inline-block; /* Inline-block element */
    font-size: 16px; /* Font size */
    position:relative;
    right:180px; 
    top:20px;
    cursor: pointer; /* Pointer cursor on hover */
    border-radius: 10px; /* Rounded corners */
    box-shadow: 5px 5px 50px rgba(0,0,0,0.3);
    z-index:2;
}
.game-button:active {
    transform: scale(0.9); /* Slightly shrink the button size */
    transition: transform 0.3s ease-in-out; /* Smooth transition with a longer duration */
    border:1px solid rgb(66, 11, 11)
}
.game-button:disabled {
    background-color:#b60b0b;
    cursor: not-allowed;
}


.instructions {
    position:relative;
    font-size: 18px;
    color: #badee0;
    display:flex;
    justify-content: center; /* Center child elements horizontally */
    align-items: center; /* Center child elements vertically */
}
.red-circle-a::after {

     z-index: 10;

}

.red-circle-c::after {
    content: '';

 .dice-container {
  display:flex;
  position: relative;
  bottom:43px;
  gap: 40px;
  perspective: 1000px;
  justify-content: center;
  align-items: center;
}

.dice {
  width: 60px;
  height: 60px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 1.5s ease-out;
  cursor: pointer;
}

.face {
  position: absolute;
  width: 100%;
  height: 100%;
  background: white;
  border: 2px solid #333;
  border-radius: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 1.5rem;
  font-weight: bold;
  box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
}

/* Dice dot styling */
.face::before {
  content: "";
  width: 15px;
  height: 15px;
  background: #333;
  border-radius: 60%;
  position: absolute;
}

/* Position each face */
.front  { transform: rotateY(0deg) translateZ(30px); }
.back   { transform: rotateY(180deg) translateZ(30px); }
.right  { transform: rotateY(90deg) translateZ(30px); }
.left   { transform: rotateY(-90deg) translateZ(30px); }
.top    { transform: rotateX(90deg) translateZ(30px); }
.bottom { transform: rotateX(-90deg) translateZ(30px); }

/* Dice dots configuration - standard dice layout */
.front::before { /* 1 */
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  box-shadow: none;
}
.back::before { /* 6 */
  top: 5%; left: 12%;
  box-shadow:
    0 20px #333,      /* middle left */
    0 40px #333,      /* bottom left */
    30px 0 #333,      /* top right */
    30px 20px #333,   /* middle right */
    30px 40px #333;   /* bottom right */
}
.right::before { /* 3 */
  top: 10%; left: 10%;
  box-shadow:
    18px 18px #333,   /* bottom right */
    35px 35px #333;   /* far bottom right */
}
.left::before { /* 4 */
  top: 12%; left: 13%;
  box-shadow:
    0 30px #333,      /* bottom left */
    30px 0 #333,      /* top right */
    30px 30px #333;   /* bottom right */
}
.top::before { /* 5 */
  top: 13%; left: 13%;
  box-shadow:
    0 30px #333,      /* bottom left */
    30px 0 #333,      /* top right */
    30px 30px #333,   /* bottom right */
    15px 15px #333;   /* center */
}
.bottom::before { /* 2 */
  top: 13%; left: 13%;
  box-shadow:
    30px 30px #333;   /* bottom right */
}


  </style>
</head>

  <script>
    const board = document.getElementById("grid-board");

    // Example: Remove inner borders from a 3x3 box starting at cell index 11
    function getBoxIndexes(startIndex, boxSize, gridCols) {
  const indexes = [];
  for (let row = 0; row < boxSize; row++) {
    for (let col = 0; col < boxSize; col++) {
      indexes.push(startIndex + row * gridCols + col);
    }
  }
  return indexes;
}

function highlightBox(startIndex, boxSize, gridCols, color="rgb(112, 7, 7)") {
  const boxIndexes = getBoxIndexes(startIndex, boxSize, gridCols);
  
    boxIndexes.forEach((i) => {
      const cell = document.querySelector(`.cell[data-index="${i}"]`);
      if (cell) {
        // Remove all borders, then reapply outer box
        cell.style.border = "none";
 // Highlight the cell background where borders are removed
        cell.style.background = color;
      }
    });
    

     const topEdge = boxIndexes.slice(0, boxSize);
  const bottomEdge = boxIndexes.slice(-boxSize);
  const leftEdge = boxIndexes.filter((_, i) => i % boxSize === 0);
  const rightEdge = boxIndexes.filter((_, i) => (i + 1) % boxSize === 0);

  topEdge.forEach(i => document.querySelector(`.cell[data-index="${i}"]`).style.borderTop = "1px solid #030303");
  bottomEdge.forEach(i => document.querySelector(`.cell[data-index="${i}"]`).style.borderBottom = "1px solid #030303");
  leftEdge.forEach(i => document.querySelector(`.cell[data-index="${i}"]`).style.borderLeft = "1px solid #030303");
  rightEdge.forEach(i => document.querySelector(`.cell[data-index="${i}"]`).style.borderRight = "1px solid #030303");
}

    const dice = document.querySelectorAll('.dice');
const rollBtn = document.getElementById('start-game');
let rollingInterval = null;

function rollDice(die) {
  // Random rotation values
  const x = Math.floor(Math.random() * 10 + 10) * 90;
  const y = Math.floor(Math.random() * 10 + 10) * 90;
  const z = Math.floor(Math.random() * 10) * 90;
  // Random result (1-6)
  const result = Math.floor(Math.random() * 6) + 1;
  // Apply rotation
  die.style.transform = `rotateX(${x}deg) rotateY(${y}deg) rotateZ(${z}deg)`;
  // After animation completes, snap to correct face
  setTimeout(() => {
    switch(result) {
      case 1: die.style.transform = 'rotateX(0deg) rotateY(0deg)'; break;
      case 2: die.style.transform = 'rotateX(-90deg) rotateY(0deg)'; break;
      case 3: die.style.transform = 'rotateX(0deg) rotateY(90deg)'; break;
      case 4: die.style.transform = 'rotateX(0deg) rotateY(-90deg)'; break;
      case 5: die.style.transform = 'rotateX(90deg) rotateY(0deg)'; break;
      case 6: die.style.transform = 'rotateX(180deg) rotateY(0deg)'; break;
    }
  }, 300);
}

// Roll animation for both dice
function startRolling() {
  if (rollingInterval) return;
  rollBtn.disabled = true;
  rollingInterval = setInterval(() => {
    dice.forEach(die => rollDice(die));
  }, 200);
  // Stop after 2 seconds and show final result
  setTimeout(() => {
    clearInterval(rollingInterval);
    rollingInterval = null;
    dice.forEach(die => rollDice(die));
    rollBtn.disabled = false;
  }, 2000);
}

rollBtn.addEventListener('click', startRolling);
