<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grid Box Border</title>
  <style>
    body{
      margin:0;
      padding:0;
      background-color:#6e5f5f;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(15, 40px);
      grid-template-rows: repeat(15, 40px);
      margin: 40px auto;
      width: max-content;
      border: 10px solid rgb(8, 88, 102);
      border-radius:10px;
      box-shadow: 5px 5px 50px rgba(0,0,0,0.3);
    }
    .cell {
      width: 40px;
      height: 40px;
      background: #f0f0f0;
      border: 1px solid #030303a6;
      box-sizing: border-box;
    }
    .cell-middle {
  position: relative;
}
.cell-middle:after {
  content: 'HOME';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: #85e7f869;
  color: rgb(0, 0, 0);
  z-index: 5;
  font-weight: 800;
  font-family: 'Orbitron', sans-serif;
  text-shadow: 0 0 8px rgba(0, 255, 255, 2.9);
  animation: pulse-glow 1s infinite alternate;
}
@keyframes pulse-glow {
  0% { box-shadow: 0 0 15px rgba(18, 247, 247, 1.9); }
  100% { box-shadow: 0 0 20px rgba(7, 211, 238, 0.8); }
}

.button-container {
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 5px;
    margin-top: 30px; /* or whatever spacing you want */
    position: static; /* Remove absolute positioning */
    top: auto;
    left: auto;
    transform: none;
}
.game-button{
    width:80px;
    background-color: #b60b0b; /* Red background */
    color: white; /* White text */
    border:1px solid rgb(211, 23, 23); /* No border */
    padding: 10px 20px; /* Padding around the text */
    text-align: center; /* Centered text */
    text-decoration: none; /* No underline */
    display: inline-block; /* Inline-block element */
    font-size: 16px; /* Font size */
    position:relative;
    right:180px; 
    bottom:27px;
    cursor: pointer; /* Pointer cursor on hover */
    border-radius: 10px; /* Rounded corners */
    box-shadow: 5px 5px 50px rgba(0,0,0,0.3);
}
.game-button:active {
    transform: scale(0.9); /* Slightly shrink the button size */
    transition: transform 0.3s ease-in-out; /* Smooth transition with a longer duration */
    border:1px solid rgb(66, 11, 11)
}
.game-button:disabled {
    background-color:#b60b0b;
    cursor: not-allowed;
}
.dice-container {
    position:absolute;
    left: 50%;
    transform: translateX(-50%);
    display:flex;
    gap: 20px;
}
.dice-box {
    width: 60px;
    height: 60px;
    background-color: white;
    border: 1px solid #b60b0b;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom:5%;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
   box-shadow: 5px 5px 50px rgba(0,0,0,0.3);
}
.dice-box:active{
    transform: scale(0.95); /* Slightly shrink the button */
    transition: transform 0.1s ease-in-out; /* Smooth transition */   
}
.dice-box.selected {
    background-color: #ffcccc;
    border-color: #b60b0b;
    box-shadow: 0 0 10px rgba(182, 11, 11, 0.5);
}
.dice-box.disabled {
    background-color: #e0e0e0;
    color: #a0a0a0;
    cursor: not-allowed;
}
.sum-box {
    background-color: #f0f0f0;
}
.sum-box:active{
    transform: scale(0.95); /* Slightly shrink the button */
    transition: transform 0.1s ease-in-out; /* Smooth transition */
}
.instructions {
    position:relative;
    font-size: 18px;
    color: #badee0;
    display:flex;
    justify-content: center; /* Center child elements horizontally */
    align-items: center; /* Center child elements vertically */
}
.red-circle-a::after {
    content: '';
    position :absolute;
    top:50%;
    left:50%;
    transform: translate(-50%, -50%);
    width: 36px;
    height: 36px;
    background: radial-gradient(circle at 30% 30%, #ff5e5e, #cc0000);

    justify-content: center;
    align-items: center;
    font-size: 14px; /* Font size for content inside the circle */
    font-weight: bold; /* Bold text */
    text-align: center;
     z-index: 10;
    cursor: pointer;
    box-shadow: 1px 2px 4px rgb(61, 60, 60);
    border: 2px solid rgba(124, 5, 5, 0.3);
}
.red-circle-b::after {
    content: '';

    height: 36px;
    background: radial-gradient(circle at 30% 30%, #5e5eff, #0000cc);

    display: flex;

     z-index: 10;
    cursor: pointer;
    box-shadow: 1px 2px 4px rgb(61, 60, 60);

}
.red-circle-c::after {
    content: '';

    height: 36px;

     z-index: 10;

}
.red-circle-d::after {
    content: '';

     z-index: 10;

    box-shadow: 1px 2px 4px rgb(61, 60, 60);

}


  </style>
</head>
<body>
  <div class="board" id="grid-board"></div>
  <div class="instructions">
        <p>Click On a Dice To Select it.</p>
  </div>
    <div class="dice-container">
        <div class="dice-box" id="dice1" onclick="selectDice(1)"></div>
        <div class="dice-box" id="dice2" onclick="selectDice(2)"></div>
        <div class="dice-box" id="sum" onclick="selectDice(3)"></div>
    </div>

    
    <div class="button-container">
        <button id="start-game" class="game-button" onclick="rollDice()">Roll dice</button>
    </div>

  <script>
    const board = document.getElementById("grid-board");

    for (let i = 0; i < 225; i++) {
      const cell = document.createElement("div");
      cell.classList.add("cell");
      cell.dataset.index = i;
      board.appendChild(cell);
    }

    // Example: Remove inner borders from a 3x3 box starting at cell index 11
    function getBoxIndexes(startIndex, boxSize, gridCols) {
  const indexes = [];
  for (let row = 0; row < boxSize; row++) {
    for (let col = 0; col < boxSize; col++) {
      indexes.push(startIndex + row * gridCols + col);
    }
  }
  return indexes;
}

function highlightBox(startIndex, boxSize, gridCols, color="rgb(112, 7, 7)") {
  const boxIndexes = getBoxIndexes(startIndex, boxSize, gridCols);
  
    boxIndexes.forEach((i) => {
      const cell = document.querySelector(`.cell[data-index="${i}"]`);
      if (cell) {
        // Remove all borders, then reapply outer box
        cell.style.border = "none";
 // Highlight the cell background where borders are removed
        cell.style.background = color;
      }
    });
    

     const topEdge = boxIndexes.slice(0, boxSize);
  const bottomEdge = boxIndexes.slice(-boxSize);
  const leftEdge = boxIndexes.filter((_, i) => i % boxSize === 0);
  const rightEdge = boxIndexes.filter((_, i) => (i + 1) % boxSize === 0);

  topEdge.forEach(i => document.querySelector(`.cell[data-index="${i}"]`).style.borderTop = "1px solid #030303");
  bottomEdge.forEach(i => document.querySelector(`.cell[data-index="${i}"]`).style.borderBottom = "1px solid #030303");
  leftEdge.forEach(i => document.querySelector(`.cell[data-index="${i}"]`).style.borderLeft = "1px solid #030303");
  rightEdge.forEach(i => document.querySelector(`.cell[data-index="${i}"]`).style.borderRight = "1px solid #030303");
}



highlightBox(0, 6, 15); // Example call
highlightBox(9, 6, 15, " rgb(4, 88, 4)");  
highlightBox(135, 6, 15, "rgb(2, 8, 87)");
highlightBox(144, 6, 15, "rgb(138, 95, 3)");

</html>
