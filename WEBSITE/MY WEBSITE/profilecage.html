<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Products</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:700,400&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      background: linear-gradient(110deg, #a833ff 0%, #ff48c4 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header-section {
      width: 100%;
      padding: 60px 0 40px 0;
      text-align: center;
      position: relative;
      z-index: 2;
      background-color: green;
    }
    .neon-title {
      font-size: 54px;
      color: #fff;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow:
        0 0 10px #fff,
        0 0 20px #f0f,
        0 0 40px #a833ff,
        0 0 80px #ff48c4;
      filter: brightness(1.2);
      animation: neon-glow 2s infinite alternate;
      margin: 0;
    }
    @keyframes neon-glow {
      0% { text-shadow: 0 0 10px #fff, 0 0 20px #f0f, 0 0 40px #a833ff, 0 0 80px #ff48c4; }
      100% { text-shadow: 0 0 20px #fff, 0 0 40px #f0f, 0 0 80px #a833ff, 0 0 160px #ff48c4; }
    }
    .wave-bg {
      position: absolute;
      left: 0; top: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .products-area {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 60px 20px;
      position: relative;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
    }
    .product-card {
      background: rgba(255,255,255,0.07);
      border-radius: 24px;
      box-shadow: 0 10px 32px rgba(168,51,255,0.10), 0 2px 8px rgba(0,0,0,0.08);
      width: 380px;
      max-width: 100%;
      aspect-ratio: 1/1;
      position: relative;
      overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s;
      cursor: pointer;
    }
    .product-card:hover {
      transform: translateY(-12px) scale(1.03);
      box-shadow: 0 20px 48px rgba(168,51,255,0.18), 0 0 40px #ff48c4;
      z-index: 3;
    }
    .collage {
      width: 100%;
      height: 70%;
      display: block;
      padding: 0;
    }
    .collage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(168,51,255,0.10);
      background: #fff;
      transition: filter 0.2s;
    }
    .product-card:hover .collage img {
      filter: brightness(1.08) saturate(1.2);
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin: 18px 0 24px 0;
      text-shadow: 0 2px 8px #a833ff44;
      letter-spacing: 1px;
      text-align: center;
      z-index: 2;
      padding: 0 20px;
    }
    @media (max-width: 1100px) {
      .products-area {
        gap: 32px;
      }
    }
    @media (max-width: 900px) {
      .product-card {
        width: 340px;
      }
    }
    @media (max-width: 700px) {
      .header-section { padding: 40px 0 24px 0; }
      .neon-title { font-size: 32px; }
      .products-area { padding-bottom: 30px; }
      .product-card {
        width: 90vw;
      }
    }
  </style>
</head>
<body>
  
</body>
</html>
