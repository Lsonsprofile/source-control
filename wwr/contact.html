<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>White Water Rafting — About Us page</title>
  <meta name="description" content="About White Water Rafting — our mission, history, and why adventure seekers choose us.">
  <meta name="author" content="Emmanuel Ndogo">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
  <header>
    <a href="" class="logo-link">
      <img src="images/rafting.png" alt="White Water Rafting logo">
    </a>
    <nav>
      <ul class="main-nav">
        <li><a href="home.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="history.html">Trips</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="main">
      <div class="info">
        <h1>White Water Rafting Company</h1>
        <p>123 Main River Street</p>
        <p>Kolob, California</p>
        <p>+1 999 999 9999</p>
        <p>info@whitewater.com</p>
      </div>
      <div class="map">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3076.0000749148953!2d-120.83306542509192!3d39.55960587159027!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x809c7c4165a00f3b%3A0x71e42a9e40ed9212!2s123%20River%20St%2C%20Downieville%2C%20CA%2095936%2C%20USA!5e0!3m2!1sen!2sng!4v1759535858030!5m2!1sen!2sng" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <form>
        <div class="form-item input1">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="User name" required>
        </div>
        <div class="form-item input2">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Email address" required>
        </div>
        <div class="form-item">
          <label>Message Purpose</label>
          <div class="radio-group">
            <label><input type="radio" name="purpose" value="general"> General Inquiry</label>
            <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
            <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
          </div>
        </div>
        <div class="form-item messages">
          <label for="message">Message</label>
          <textarea id="message" placeholder="Type here..." rows="3"></textarea>
        </div>
        <div class="checkbox">
          <label><input type="checkbox" name="subscribe"> Please Subscribe me to the monthly newsletter</label>
        </div>
        <button type="submit">Get in Touch!</button>
      </form>
      <section class="services">
        <h2>We Are Here To Serve</h2>
        <div class="ads-image">
          <figure>
            <img src="images/anaka.jpg" alt="Anaka Yuki profile image">
            <figcaption>Anaka Yuki - Customer Service Specialist</figcaption>
          </figure>
        </div>
        <div class="ads-image">
          <figure>
            <img src="images/Dmitri.jpg" alt="Dmitri Martínez profile image">
            <figcaption>Dmitri Martínez - General Manager of Rafting Company</figcaption>
          </figure>
        </div>
        <div class="ads-image">
          <figure>
            <img src="images/Martínez.jpg" alt="Smith Martínez profile image">
            <figcaption>Smith Martínez - Adventure Tour Coordinator</figcaption>
          </figure>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 | White Water Rafting Co. | Emmanuel Ndogo</p>
    <nav class="socialmedia" aria-label="Social media links">
      <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">
        <img src="images/facebook.svg" alt="Facebook icon">
      </a>
      <a href="https://www.linkedin.com" target="_blank" rel="noopener noreferrer">
        <img src="images/linkedin.svg" alt="LinkedIn icon">
      </a>
      <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">
        <img src="images/instagram.svg" alt="Instagram icon">
      </a>
    </nav>
  </footer>
</body>
</html>
