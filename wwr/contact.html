<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>White Water Rafting | contact Us page</title>
  <meta name="description" content="contact page says Reach White Water Rafting Co. for inquiries, reservations, or suggestions. View our location, meet our team, and connect through our contact form. Newsletter subscription and support available.">
  <meta name="author" content="Emmanuel Ndogo">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
  <header>
<img src="images/rafting.png" alt="White Water Rafting logo">
<nav>
<a href="home.html">Home</a>
<a href="about.html">About Us</a>
<a href="trip.html">Trips</a>
<a href="contact.html" class="active">Contact Us</a>
</nav>
</header>

  <main>
    <div class="main">
      <div class="info">
        <h1>White Water Rafting Company</h1>
        <p>123 Main River Street</p>
        <p>Kolob, California</p>
        <p>+1 999 999 9999</p>
        <p>info@whitewater.com</p>
      </div>
      <section class="map-container">
        <h2>Our Location</h2>
      <div class="map">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3076.0000749148953!2d-120.83306542509192!3d39.55960587159027!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x809c7c4165a00f3b%3A0x71e42a9e40ed9212!2s123%20River%20St%2C%20Downieville%2C%20CA%2095936%2C%20USA!5e0!3m2!1sen!2sng!4v1759535858030!5m2!1sen!2sng" referrerpolicy="no-referrer-when-downgrade" title="White Water Rafting location map"></iframe>
      </div>
    </section>
      <section class="contact-form">
        <h2>Contact Us | White Water Rafting</h2>
        <form>
          <div class="form-item input1">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="User name" required>
          </div>
          <div class="form-item input2">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Email address" required>
          </div>
          <div class="form-item">
            <label>Message Purpose</label>
            <div class="radio-group">
              <label><input type="radio" id="inquiry" name="purpose" value="general"> General Inquiry</label>
              <label><input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question</label>
              <label><input type="radio" id="website" name="purpose" value="suggestion"> Website Suggestion</label>
            </div>
          </div>
          <div class="form-item messages">
            <label for="message">Message</label>
            <textarea id="message" placeholder="Type here..." rows="3"></textarea>
          </div>
          <div class="checkbox">
            <label><input type="checkbox" id="newsletter" name="subscribe"> Please Subscribe me to the monthly newsletter</label>
          </div>
          <button type="submit">Get in Touch!</button>
        </form>
      </section>

      <section class="services">
        <h2>MEET OUR GUIDES</h2>
          <figure>
            <img src="images/anaka.jpg" alt="Anaka Yuki profile image">
            <figcaption>Anaka Yuki - Customer Service Specialist</figcaption>
          </figure>

          <figure>
            <img src="images/dmitri.jpg" alt="Dmitri Martinez profile image">
            <figcaption>Dmitri Martinez - General Manager of Rafting Company</figcaption>
          </figure>

          <figure>
            <img src="images/martinez.jpg" alt="Smith Martinez profile image">
            <figcaption>Smith Martinez - Adventure Tour Coordinator</figcaption>
          </figure>

          <figure>
            <img src="images/martinez.jpg" alt="Smith Martinez profile image">
            <figcaption>Smith Martinez - Adventure Tour Coordinator</figcaption>
          </figure>
      </section>
      
    </div>
  </main>

  <footer>
    <p>&copy; 2025 | White Water Rafting Co. | Emmanuel Ndogo</p>

        <img src="images/linkedin.svg" alt="LinkedIn icon">
      </a>
      <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">
        <img src="images/instagram.svg" alt="Instagram icon">
      </a>
  </footer>
</body>
</html>
